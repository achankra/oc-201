# Generated by occ scaffold component
# Component: lab5-greeter
# Type: deployment/service-governed
# Traits: observability-alert-rule
apiVersion: openchoreo.dev/v1alpha1
kind: Component
metadata:
  name: lab5-greeter
  namespace: default
spec:
  owner:
    projectName: default
  componentType:
    kind: ClusterComponentType
    name: deployment/service-governed
  # autoDeploy: true # Enable automatic deployment on changes

  # Traits augment the component with additional capabilities
  traits:
    - kind: ClusterTrait
      name: observability-alert-rule # Trait resource name
      instanceName: <observability-alert-rule-instance> # Unique instance name within this Component
      # Parameters for observability-alert-rule trait
      parameters:
        description: <TODO_DESCRIPTION> # A human-readable description of what this alert rule monitors and when it triggers.

        # Empty object, or customize:
        condition: {}
        # condition:
          # threshold: 10 # The numeric threshold value used with the operator to determine when the alert triggers.
          # interval: 1m # The frequency at which the alert rule is evaluated (e.g. 1m, 5m, 15m, 30m).
          # operator: gt # The comparison operator used to evaluate the condition against the threshold (gt: greater than, lt: less than, gte: greater than or equal, lte: less than or equal, eq: equal). | also: lt, gte, lte, eq
          # window: 5m # The time window over which data is aggregated before evaluating the alert condition (e.g. 5m, 10m, 30m, 1h).
        source:
          type: log # The data source type for the alert rule. | also: metric, budget

          # Defaults: Uncomment to customize
          # metric: # The predefined metric to monitor for metric-based alerts. Must be one of: cpu_usage, memory_usage. Required when source type is 'metric'.
          # query: # The query expression for log-based alerts. Required when source type is 'log'.

        # Defaults: Uncomment to customize
        # severity: warning # The severity level of alerts triggered by this rule. Determines alert priority and notification urgency. | also: warning, critical
